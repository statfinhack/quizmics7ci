<!DOCTYPE html>
<html lang="fr" style="background:#fff">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── NUCLEAR DARK MODE LOCK ─────────────────────────────── */
:root            { color-scheme: only light }
html             { filter: none !important; -webkit-filter: none !important;
                   background: #fff !important; color: #111827 !important }
body             { background: #fff !important; color: #111827 !important }
@media (prefers-color-scheme: dark) {
  html, body     { background: #fff !important; color: #111827 !important }
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --ink:   #111827;
  --ink2:  #374151;
  --ink3:  #6B7280;
  --line:  #E5E7EB;
  --surf:  #FFFFFF;
  --bg:    #F9FAFB;
  --bg2:   #F3F4F6;

  --p:     #4F46E5;   /* indigo-600  — primary             */
  --p-d:   #3730A3;   /* indigo-800  — hover / darker      */
  --p-l:   #EEF2FF;   /* indigo-50   — selection tint      */
  --p-m:   #C7D2FE;   /* indigo-200  — progress track      */

  --ok:    #059669;
  --warn:  #D97706;
  --bad:   #DC2626;

  --r:     14px;
  --rs:    10px;
  --sh:    0 1px 3px rgba(0,0,0,.07), 0 4px 14px rgba(0,0,0,.06);
}

/* ── TYPOGRAPHY ─────────────────────────────────────────── */
html, body, input, textarea, button, select {
  font-family: 'Outfit', system-ui, sans-serif !important;
}

/* ── LAYOUT ─────────────────────────────────────────────── */
body {
  min-height: 100vh;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(120px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 600px; margin: 0 auto }

/* ── TIMER BAR (fixed top) ──────────────────────────────── */
#timer-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: rgba(255,255,255,.97) !important;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1.5px solid var(--line);
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
}
.timer-inner { max-width: 600px; margin: 0 auto }

.tbox {
  border-radius: var(--r); padding: 11px 18px;
  display: flex; align-items: center; gap: 14px;
}
.t-blue   { background: linear-gradient(135deg,#3730A3,var(--p)); box-shadow: 0 4px 16px rgba(79,70,229,.3) }
.t-orange { background: linear-gradient(135deg,#78350F,var(--warn)); box-shadow: 0 4px 16px rgba(217,119,6,.3) }
.t-red    { background: linear-gradient(135deg,#7F1D1D,var(--bad)); box-shadow: 0 4px 16px rgba(220,38,38,.35); animation: pulse .7s infinite }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.82} }

.t-ico  { font-size: 1.6rem; line-height: 1 }
.t-time { color: #fff !important; font-size: 2rem; font-weight: 900;
          letter-spacing: 4px; line-height: 1; font-variant-numeric: tabular-nums }
.t-lbl  { color: rgba(255,255,255,.75) !important; font-size: .7rem;
          font-weight: 700; margin-top: 3px; text-transform: uppercase; letter-spacing: .1em }
.spacer-timer { height: calc(80px + env(safe-area-inset-top, 0px)) }

/* ── PROGRESS ───────────────────────────────────────────── */
.prog-wrap { padding: 16px 0 8px }
.prog-header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: .82rem; font-weight: 600;
  color: var(--ink2) !important;
  margin-bottom: 8px;
}
.prog-title { font-weight: 700; font-size: .9rem; color: var(--ink) !important }
.prog-bg   { background: var(--p-m); border-radius: 99px; height: 6px; overflow: hidden }
.prog-fill { background: linear-gradient(90deg,var(--p),#818CF8);
             height: 6px; border-radius: 99px; transition: width .4s }

/* ── QUESTION CARD ──────────────────────────────────────── */
.qcard {
  background: var(--surf) !important;
  border: 1.5px solid var(--line);
  border-left: 5px solid var(--p);
  border-radius: 0 var(--r) var(--r) 0;
  padding: 16px 18px 14px;
  margin: 12px 0 0;
  box-shadow: var(--sh);
}
.qmeta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.q-num  { background: var(--p); color: #fff !important; font-size: .68rem;
          font-weight: 900; padding: 3px 10px; border-radius: 99px; letter-spacing: .04em }
.q-type { color: var(--ink3) !important; font-size: .75rem; font-weight: 600 }
.q-pts  { background: var(--bg2); color: var(--ink2) !important; font-size: .68rem;
          font-weight: 800; padding: 3px 10px; border-radius: 99px; margin-left: auto }
.qtext  { font-size: 15.5px !important; font-weight: 500 !important;
          color: #111827 !important; margin: 0 0 14px; line-height: 1.55 }

/* ── OPTIONS ────────────────────────────────────────────── */
.options { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px }

.opt {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg) !important;
  border: 2px solid var(--line);
  border-radius: var(--r); padding: 14px 16px;
  cursor: pointer; transition: border-color .12s, background .12s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-height: 52px;
}
.opt:active { background: var(--p-l) !important; border-color: var(--p) }
.opt.selected {
  background: var(--p-l) !important;
  border-color: var(--p);
}

/* Indicator circle/square */
.opt-ind {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2.5px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--surf) !important; transition: all .12s;
}
.opt.selected .opt-ind { background: var(--p) !important; border-color: var(--p) }
.opt-ind-sq { border-radius: 6px }
.opt-check { display: none; color: #fff !important; font-size: .75rem; font-weight: 900; line-height: 1 }
.opt.selected .opt-check { display: block }

/* Option text — hardcoded everywhere */
.opt-text {
  font-size: 15px !important; font-weight: 500 !important;
  line-height: 1.4; flex: 1;
  color: #111827 !important;
}
.opt.selected .opt-text { color: var(--p-d) !important; font-weight: 600 !important }

/* ── TEXT / NUMERIC INPUTS ──────────────────────────────── */
.q-input {
  width: 100%; padding: 13px 16px; font-size: 16px;
  font-family: 'Outfit', system-ui, sans-serif !important;
  font-weight: 500; border: 2px solid var(--line); border-radius: var(--rs);
  background: var(--surf) !important; color: var(--ink) !important;
  outline: none; box-shadow: var(--sh); transition: border-color .15s;
  -webkit-appearance: none;
}
.q-input:focus { border-color: var(--p); box-shadow: 0 0 0 4px rgba(79,70,229,.1) }
.q-input::placeholder { color: var(--ink3) !important }
textarea.q-input { resize: none; min-height: 88px }

/* ── ANTICHEAT BANNER ───────────────────────────────────── */
#anticheat-banner {
  position: fixed; bottom: 90px;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  background: #FEF3C7 !important; border: 1.5px solid #FCD34D;
  border-radius: var(--rs); padding: 10px 14px;
  font-size: .8rem; font-weight: 600; color: #92400E !important;
  z-index: 9998; text-align: center;
}

/* ── SUBMIT BAR (fixed bottom) ──────────────────────────── */
.submit-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 9997;
  background: rgba(255,255,255,.97) !important;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1.5px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 20px rgba(0,0,0,.06);
}
.submit-inner { max-width: 600px; margin: 0 auto }
.prog-mini {
  font-size: .78rem; color: var(--ink3) !important; font-weight: 600;
  text-align: center; margin-bottom: 8px;
}
.btn-submit {
  width: 100%; padding: 15px; font-size: 15px;
  font-family: 'Outfit', system-ui, sans-serif !important;
  font-weight: 800; border: none; border-radius: var(--rs); cursor: pointer;
  background: linear-gradient(135deg,var(--p),var(--p-d));
  color: #fff !important; letter-spacing: -.01em;
  box-shadow: 0 4px 16px rgba(79,70,229,.38);
  transition: transform .12s, box-shadow .12s;
  -webkit-tap-highlight-color: transparent;
}
.btn-submit:active { transform: scale(.98); box-shadow: 0 2px 8px rgba(79,70,229,.3) }
.btn-submit:disabled { opacity: .6; cursor: not-allowed }

/* ── LOADING OVERLAY ────────────────────────────────────── */
#overlay {
  display: none; position: fixed; inset: 0; z-index: 99999;
  background: rgba(255,255,255,.95) !important;
  flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Outfit', system-ui, sans-serif !important;
}
#overlay.show { display: flex }
.ov-ring {
  width: 52px; height: 52px;
  border: 4px solid var(--p-m);
  border-top-color: var(--p);
  border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 18px;
}
.ov-text { font-size: 1rem; font-weight: 700; color: var(--ink2) !important }
@keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>
<body>

<!-- Timer fixe -->
<div id="timer-bar">
  <div class="timer-inner">
    <div class="tbox t-blue" id="tbox">
      <span class="t-ico" id="t-ico">⏱</span>
      <div>
        <p class="t-time" id="t-time">--:--</p>
        <p class="t-lbl" id="t-lbl">Temps restant</p>
      </div>
    </div>
  </div>
</div>
<div class="spacer-timer"></div>

<div class="wrap">
  <!-- Progression -->
  <div class="prog-wrap">
    <div class="prog-header">
      <span class="prog-title" id="quiz-title-prog"></span>
      <span id="prog-count" style="color:#6B7280">0/0 répondue(s)</span>
    </div>
    <div class="prog-bg">
      <div class="prog-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Questions -->
  <div id="questions-container"></div>
</div>

<!-- Barre de soumission -->
<div class="submit-bar">
  <div class="submit-inner">
    <div class="prog-mini" id="prog-mini">0 réponse(s) sur 0</div>
    <button class="btn-submit" id="submit-btn" onclick="submitQuiz()">
      ✅&nbsp; Soumettre mes réponses
    </button>
  </div>
</div>

<!-- Overlay chargement -->
<div id="overlay">
  <div class="ov-ring"></div>
  <div class="ov-text">Envoi en cours…</div>
</div>

<script>
document.title = "Quiz — " + PROJECT_NAME;

const H = {
  "apikey": SUPA_KEY,
  "Authorization": "Bearer " + SUPA_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

async function supa(path, opts = {}) {
  const r = await fetch(SUPA_URL + "/rest/v1/" + path, {
    headers: { ...H, ...(opts.headers || {}) },
    method: opts.method || "GET",
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || r.statusText); }
  if (r.status === 204) return null;
  return r.json();
}

let agent = null, quiz = null, questions = [], answers = {}, sessionId = null, startEpoch = null, deviceInfo = "";
let timerInterval = null, autoSaveInterval = null;

async function init() {
  try {
    agent     = JSON.parse(sessionStorage.getItem("qa_agent") || "null");
    quiz      = JSON.parse(sessionStorage.getItem("qa_quiz") || "null");
    sessionId = parseInt(sessionStorage.getItem("qa_session_id") || "0");
    startEpoch = parseFloat(sessionStorage.getItem("qa_start_epoch") || (Date.now()/1000));

    deviceInfo = [
      navigator.platform || "",
      screen.width + "x" + screen.height,
      navigator.language || "",
      /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : "desktop"
    ].filter(Boolean).join(" | ");

    if (!agent || !quiz || !sessionId) { window.location.href = "index.html"; return; }

    const qs = await supa(`questions?quiz_id=eq.${quiz.id}&select=id,texte,type,ordre,points,reponse_correcte_num,reponse_correcte_txt,image_url&order=ordre.asc`);
    const qIds = qs.map(q => q.id).join(",");
    const allOpts = qIds.length > 0 ? await supa(`options?question_id=in.(${qIds})&order=question_id.asc,id.asc`) : [];
    const optsMap = {};
    (allOpts || []).forEach(o => {
      if (!optsMap[o.question_id]) optsMap[o.question_id] = [];
      optsMap[o.question_id].push(o);
    });
    qs.forEach(q => { q.options = optsMap[q.id] || []; });
    questions = qs;

    if (quiz.randomize_questions) {
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }
    }

    const sessData = await supa(`sessions?id=eq.${sessionId}&limit=1`);
    if (sessData && sessData[0]) {
      try { const saved = JSON.parse(sessData[0].answers_json || "{}"); Object.assign(answers, saved); } catch(e) {}
      try {
        let existingLog = JSON.parse(sessData[0].devices_log || "[]");
        if (!existingLog.includes(deviceInfo)) existingLog.push(deviceInfo);
        sessionStorage.setItem("_dlog", JSON.stringify(existingLog));
      } catch(e) { sessionStorage.setItem("_dlog", JSON.stringify([deviceInfo])); }
    } else {
      sessionStorage.setItem("_dlog", JSON.stringify([deviceInfo]));
    }

    const maxScore = questions.reduce((s, q) => s + q.points, 0);
    await supa(`sessions?id=eq.${sessionId}`, { method: "PATCH", body: { max_score: maxScore } });

    window.MALUS_ACTIF  = quiz.malus_actif  ? true : false;
    window.MALUS_POINTS = parseFloat(quiz.malus_points || 0);
    window.ANTICHEAT    = quiz.anticheat_actif ? true : false;
    if (window.ANTICHEAT) {
      try {
        const acList = JSON.parse(quiz.anticheat_agents || "[]");
        if (acList.length > 0 && !acList.includes(agent.id)) window.ANTICHEAT = false;
      } catch(e) {}
    }

    renderQuestions();
    startTimer();
    autoSaveInterval = setInterval(autoSave, 5000);

    if (window.ANTICHEAT) {
      window._quitCount = 0;
      window._quitMax   = parseInt(quiz.anticheat_max || 3);
      window._lastQuit  = 0;

      const banner = document.createElement("div");
      banner.id = "anticheat-banner";
      banner.innerHTML = "🔒 Mode surveillé — quitter cet écran " + window._quitMax + " fois entraîne la soumission automatique";
      document.body.appendChild(banner);

      document.addEventListener("visibilitychange", function() {
        if (!document.hidden) return;
        const now = Date.now();
        if (now - window._lastQuit < 3000) return;
        window._lastQuit = now;
        window._quitCount++;
        supa(`sessions?id=eq.${sessionId}`, { method: "PATCH", body: { quit_count: window._quitCount } }).catch(() => {});
        const remaining = window._quitMax - window._quitCount;
        if (remaining > 0) {
          banner.style.background = "#FEE2E2";
          banner.style.borderColor = "#FCA5A5";
          banner.style.color = "#991B1B";
          banner.innerHTML = `⚠️ Sortie ${window._quitCount}/${window._quitMax} — encore ${remaining} avant soumission automatique`;
        } else {
          banner.innerHTML = "🚨 Soumission automatique en cours…";
          clearInterval(autoSaveInterval);
          setTimeout(() => submitQuiz(true), 1500);
        }
      });
    }

  } catch(e) {
    alert("Erreur de chargement : " + e.message + "\nRetour à l'accueil.");
    window.location.href = "index.html";
  }
}

function fmt(text) {
  let t = String(text || "");
  t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  t = t.replace(/\*([^*]+?)\*/g,  "<i>$1</i>");
  t = t.replace(/\[rouge\](.+?)\[\/rouge\]/g,   '<b style="color:#DC2626;font-weight:700">$1</b>');
  t = t.replace(/\[bleu\](.+?)\[\/bleu\]/g,     '<b style="color:#4F46E5;font-weight:700">$1</b>');
  t = t.replace(/\[vert\](.+?)\[\/vert\]/g,     '<b style="color:#059669;font-weight:700">$1</b>');
  t = t.replace(/\[orange\](.+?)\[\/orange\]/g, '<b style="color:#D97706;font-weight:700">$1</b>');
  t = t.replace(/\n/g, "<br>");
  return t;
}

function renderQuestions() {
  document.getElementById("quiz-title-prog").textContent = quiz.titre;
  const container = document.getElementById("questions-container");
  const ICONS = { single:"⭕", multiple:"☑️", numeric:"🔢", text:"📝" };
  const HINTS = { single:"Une seule réponse", multiple:"Plusieurs réponses", numeric:"Entrez un nombre", text:"Réponse libre" };

  container.innerHTML = questions.map((q, i) => {
    const pts = `${q.points} pt${q.points !== 1 ? "s" : ""}`;
    let inputHtml = "";

    if (q.type === "single") {
      inputHtml = `<div class="options">` + q.options.map(o =>
        `<div class="opt${answers[q.id] == o.id ? ' selected' : ''}" onclick="selectSingle(${q.id},${o.id},this)">
           <div class="opt-ind"><span class="opt-check">✓</span></div>
           <span class="opt-text" style="color:#111827">${o.texte}</span>
         </div>`
      ).join("") + `</div>`;

    } else if (q.type === "multiple") {
      const cur = answers[q.id] || [];
      inputHtml = `<div class="options">` + q.options.map(o =>
        `<div class="opt${cur.includes(o.id) ? ' selected' : ''}" onclick="toggleMultiple(${q.id},${o.id},this)">
           <div class="opt-ind opt-ind-sq"><span class="opt-check">✓</span></div>
           <span class="opt-text" style="color:#111827">${o.texte}</span>
         </div>`
      ).join("") + `</div>`;

    } else if (q.type === "numeric") {
      inputHtml = `<input type="number" class="q-input" id="q_${q.id}" placeholder="Entrez un nombre…"
        value="${answers[q.id] || ''}" oninput="answers[${q.id}]=this.value;updateProgress()" inputmode="decimal">`;

    } else {
      inputHtml = `<textarea class="q-input" id="q_${q.id}" placeholder="Votre réponse…"
        oninput="answers[${q.id}]=this.value;updateProgress()">${answers[q.id] || ''}</textarea>`;
    }

    return `
    <div class="qcard" id="qcard_${q.id}">
      <div class="qmeta">
        <span class="q-num">Q${i+1}</span>
        <span class="q-type">${ICONS[q.type]} ${HINTS[q.type]}</span>
        <span class="q-pts">${pts}</span>
      </div>
      ${q.image_url ? `<img src="${q.image_url}" style="width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin-bottom:12px;display:block" loading="lazy">` : ""}
      <p class="qtext">${fmt(q.texte)}</p>
      ${inputHtml}
    </div>`;
  }).join("");

  updateProgress();
}

function selectSingle(qid, oid, el) {
  answers[qid] = oid;
  document.getElementById(`qcard_${qid}`).querySelectorAll(".opt").forEach(o => {
    o.classList.remove("selected");
    o.querySelector(".opt-text").style.color = "#111827";
    o.querySelector(".opt-text").style.fontWeight = "500";
  });
  el.classList.add("selected");
  el.querySelector(".opt-text").style.color = "#3730A3";
  el.querySelector(".opt-text").style.fontWeight = "600";
  updateProgress();
}

function toggleMultiple(qid, oid, el) {
  if (!answers[qid]) answers[qid] = [];
  const idx = answers[qid].indexOf(oid);
  if (idx === -1) {
    answers[qid].push(oid);
    el.classList.add("selected");
    el.querySelector(".opt-text").style.color = "#3730A3";
    el.querySelector(".opt-text").style.fontWeight = "600";
  } else {
    answers[qid].splice(idx, 1);
    el.classList.remove("selected");
    el.querySelector(".opt-text").style.color = "#111827";
    el.querySelector(".opt-text").style.fontWeight = "500";
  }
  updateProgress();
}

function updateProgress() {
  const total = questions.length;
  const answered = questions.filter(q => {
    const a = answers[q.id];
    if (a === undefined || a === null || a === "") return false;
    if (Array.isArray(a)) return a.length > 0;
    return true;
  }).length;
  const pct = total > 0 ? (answered / total * 100) : 0;
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-count").textContent = `${answered}/${total} répondue(s)`;
  document.getElementById("prog-mini").textContent = `${answered} réponse(s) sur ${total}`;
}

function startTimer() {
  function tick() {
    const remaining = Math.max(0, quiz.duree_minutes * 60 - (Date.now()/1000 - startEpoch));
    const mins = Math.floor(remaining / 60);
    const secs = Math.floor(remaining % 60);
    document.getElementById("t-time").textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    const tbox = document.getElementById("tbox");
    tbox.className = "tbox " + (remaining > 300 ? "t-blue" : remaining > 60 ? "t-orange" : "t-red");
    document.getElementById("t-ico").textContent  = remaining > 300 ? "⏱" : remaining > 60 ? "⚠️" : "🚨";
    document.getElementById("t-lbl").textContent  = remaining > 300 ? "Temps restant" : remaining > 60 ? "Moins de 5 min !" : "Dépêchez-vous !";
    if (remaining <= 0) { clearInterval(timerInterval); clearInterval(autoSaveInterval); submitQuiz(true); }
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

async function autoSave() {
  try {
    let dlog = [];
    try { dlog = JSON.parse(sessionStorage.getItem("_dlog") || "[]"); } catch(e) {}
    if (deviceInfo && !dlog.includes(deviceInfo)) { dlog.push(deviceInfo); sessionStorage.setItem("_dlog", JSON.stringify(dlog)); }
    await supa(`sessions?id=eq.${sessionId}`, {
      method: "PATCH",
      body: { answers_json: JSON.stringify(answers), start_time_epoch: startEpoch, devices_log: JSON.stringify(dlog) }
    });
  } catch(e) {}
}

function calcScore() {
  let score = 0;
  const records = [];
  for (const q of questions) {
    const resp = answers[q.id];
    let ok = 0;
    if (q.type === "single") {
      const correct = q.options.filter(o => o.is_correct).map(o => o.id);
      ok = correct.includes(resp) ? 1 : 0;
      if (!ok && resp !== null && resp !== undefined && resp !== "" && window.MALUS_ACTIF) ok = -1;
    } else if (q.type === "multiple") {
      const correct = new Set(q.options.filter(o => o.is_correct).map(o => o.id));
      const given   = new Set(Array.isArray(resp) ? resp : []);
      ok = (correct.size > 0 && [...correct].every(id => given.has(id)) && [...given].every(id => correct.has(id))) ? 1 : 0;
      if (!ok && given.size > 0 && window.MALUS_ACTIF) ok = -1;
    } else if (q.type === "numeric") {
      const exp = q.reponse_correcte_num !== null ? parseFloat(q.reponse_correcte_num) : null;
      const giv = resp !== undefined && resp !== "" ? parseFloat(String(resp).replace(",",".")) : null;
      ok = (exp !== null && giv !== null && Math.abs(giv - exp) < 0.01) ? 1 : 0;
    } else if (q.type === "text") {
      const raw = (q.reponse_correcte_txt || "").trim();
      if (raw) {
        const acceptable = raw.split("|").map(s => s.toLowerCase().trim());
        ok = acceptable.includes((resp || "").toLowerCase().trim()) ? 1 : 0;
      } else { ok = 1; }
    }
    if (ok ===  1) score += q.points;
    if (ok === -1) score -= (window.MALUS_POINTS > 0 ? window.MALUS_POINTS : q.points);
    records.push({ session_id: sessionId, question_id: q.id, reponse: JSON.stringify(resp), is_correct: ok === 1 ? 1 : 0 });
  }
  return { score, records };
}

let submitting = false;
async function submitQuiz(auto = false) {
  if (submitting) return;
  submitting = true;
  clearInterval(timerInterval); clearInterval(autoSaveInterval);

  if (!auto) {
    const ok = confirm("Soumettre vos réponses maintenant ? Cette action est irréversible.");
    if (!ok) { submitting = false; startTimer(); autoSaveInterval = setInterval(autoSave, 5000); return; }
  }

  document.getElementById("overlay").classList.add("show");

  try {
    const { score, records } = calcScore();
    const maxScore = questions.reduce((s, q) => s + q.points, 0);

    let ipAddr = "";
    try {
      const ipRes = await fetch("https://api.ipify.org?format=json", { signal: AbortSignal.timeout(3000) });
      const ipJson = await ipRes.json();
      ipAddr = ipJson.ip || "";
    } catch(e) {}

    await supa(`sessions?id=eq.${sessionId}`, {
      method: "PATCH",
      body: { score, max_score: maxScore, completed: 1, completed_at: new Date().toISOString(),
              answers_json: JSON.stringify(answers), device_info: deviceInfo, ip_address: ipAddr }
    });

    for (const rec of records) {
      await supa("answers", { method: "POST", body: rec });
    }

    sessionStorage.setItem("qa_result", JSON.stringify({
      score, max_score: maxScore,
      show_score:      quiz.show_score,
      show_correction: quiz.show_correction || 0,
      agent_nom:       agent.nom,
      agent_prenom:    agent.prenom || "",
      quiz_titre:      quiz.titre
    }));
    window.location.href = "result.html";

  } catch(e) {
    alert("Erreur lors de la soumission : " + e.message);
    document.getElementById("overlay").classList.remove("show");
    submitting = false;
    startTimer();
    autoSaveInterval = setInterval(autoSave, 5000);
  }
}

init();
</script>
